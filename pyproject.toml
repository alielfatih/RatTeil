[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratteil"
version = "2024.10.22.1"
description = "Quran recitation streaming tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
  {name = "Ali Elfatih", email = "alielfatih@hotmail.com"},
]
keywords = ["quran", "recitation", "the holy Quran", "youtube", "streaming", "live stream", "islam", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Religious Users",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Multimedia :: Audio",
  "Topic :: Religion",
  "Topic :: Internet :: WWW/HTTP :: Streaming",
]

dependencies = [
  "google-api-python-client>=1.7.2,<3.0.0",
  "google-auth>=1.8.0,<3.0.0",
  "google-auth-httplib2>=0.0.3,<1.0.0",
  "google-auth-oauthlib>=0.4.1,<2.0.0",
  "oauth2client>=4.0.0,<5.0.0",
  "aiohttp>=3.8.0,<4.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
  "typing-extensions>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0,<8.0.0",
  "pytest-asyncio>=0.21.0,<1.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "httpx>=0.25.0,<1.0.0",
  "responses>=0.24.0,<1.0.0",
  "black>=23.0.0,<24.0.0",
  "isort>=5.12.0,<6.0.0",
  "flake8>=6.0.0,<7.0.0",
  "mypy>=1.5.0,<2.0.0",
  "types-aiohttp>=0.1.0,<1.0.0",
  "types-requests>=2.0.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src/"]
include = ["ratteil*"]
exclude = ["test"]
namespaces = false

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[project.scripts]
ratteil = "ratteil.cli.main:main"
ratteil-legacy = "ratteil:ratteil"

[project.urls]
Homepage = "https://github.com/alielfatih/ratteil"
Documentation = "https://github.com/alielfatih/ratteil#readme"
Repository = "https://github.com/alielfatih/ratteil"
Issues = "https://github.com/alielfatih/ratteil/issues"
