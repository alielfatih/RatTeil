[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ratteil"
version = "2024.10.22.1"
description = "Quran recitation streaming tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
  {name = "Ali Elfatih", email = "alielfatih@hotmail.com"},
]
keywords = ["quran", "recitation", "the holly Quran", "youtube", "streaming", "Live stream", "islam", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Religious Users",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Multimedia :: Audio",
  "Topic :: Religion",
  "Topic :: Internet :: WWW/HTTP :: Streaming",
]

dependencies = [
 "google-api-python-client==1.7.2",
 "google-auth==1.8.0",
 "google-auth-httplib2==0.0.3",
 "google-auth-oauthlib==0.4.1",
 "oauth2client",
]
dynamic = ["readme"]

[tool.setuptools.packages.find]
where = ["src/"]  
include = ["ratteil*"]  
exclude = ["test"]
namespaces = false 

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[project.scripts]
ratteil = "ratteil:ratteil"

[project.urls]
Homepage = "https://github.com/alielfatih/ratteil"
Documentation = "https://github.com/alielfatih/ratteil#readme"
Repository = "https://github.com/alielfatih/ratteil"
Issues = "https://github.com/alielfatih/ratteil/issues"
